# Pulls an app image from GHCR onto the server (needs the server-ssh action first).
# The job token can pull only while its job runs, and another deploy may pull at the same time:
# a docker login of this job only, in its own folder, removed right after the pull.
name: Pull image on the server
description: Pulls the image onto the server unless it is there already

inputs:
  image:
    description: Image with its tag, e.g. ghcr.io/vladushechka/personal-crm:SHA
    required: true
  env:
    description: Environment the image is for (prod or staging), for the login folder name
    required: true
  token:
    description: Token that can read the package (github.token)
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ inputs.token }}
        LOGIN_DIR: /tmp/ghcr-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.env }}
      run: |
        # A tag is a commit SHA: an image already on the server is the right one
        if ssh server "docker image inspect '$IMAGE' >/dev/null 2>&1"; then
          echo "Already on the server: $IMAGE"
          exit 0
        fi
        printf '%s' "$GHCR_TOKEN" | ssh server \
          "mkdir -m 700 '$LOGIN_DIR' && DOCKER_CONFIG='$LOGIN_DIR' docker login ghcr.io -u '$GHCR_USER' --password-stdin"
        status=0
        ssh server "DOCKER_CONFIG='$LOGIN_DIR' docker pull '$IMAGE'" || status=$?
        ssh server "rm -f '$LOGIN_DIR/config.json' && rmdir '$LOGIN_DIR'" || true
        exit $status
