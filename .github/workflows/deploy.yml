# Every push to main: build the image, push it to GHCR, deploy the same image to staging
# (https://test-app.vladmath.com) and to prod (https://app.vladmath.com), each on its own.
# The server side lives in deploy/: CI copies it to /opt/crm/<env> and runs deploy.sh <env>.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private deploy key), DEPLOY_KNOWN_HOSTS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    strategy:
      # A failed staging deploy doesn't stop prod, and the other way round
      fail-fast: false
      matrix:
        include:
          - env: staging
            url: https://test-app.vladmath.com
          - env: prod
            url: https://app.vladmath.com
    name: deploy (${{ matrix.env }})
    runs-on: ubuntu-latest
    # The deploy history of each environment is kept by GitHub (Deployments)
    environment:
      name: ${{ matrix.env }}
      url: ${{ matrix.url }}
    # One deploy per environment at a time; a newer push waits instead of cancelling a half-done one
    concurrency:
      group: deploy-${{ matrix.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # The whole folder, so a new script gets there by itself
      - name: Copy deploy scripts to the server
        run: scp deploy/* "server:/opt/crm/${{ matrix.env }}/"

      # The job token can pull the image only while this job runs, and the other environment may
      # pull at the same time: a login of this job only, in its own folder, removed after the pull
      - name: Pull the image on the server
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN_DIR: /tmp/ghcr-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.env }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server \
            "mkdir -m 700 '$LOGIN_DIR' && DOCKER_CONFIG='$LOGIN_DIR' docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          status=0
          ssh server "DOCKER_CONFIG='$LOGIN_DIR' docker pull '$IMAGE'" || status=$?
          ssh server "rm -f '$LOGIN_DIR/config.json' && rmdir '$LOGIN_DIR'" || true
          exit $status

      - name: Deploy (prod backup, migrations, new version, smoke /health)
        env:
          CRM_ENV: ${{ matrix.env }}
        run: ssh server "bash /opt/crm/$CRM_ENV/deploy.sh '$CRM_ENV' '$IMAGE'"
