# Checks every pull request before it can reach main. main is protected: a PR merges only
# when all three jobs are green. The release itself (deploy.yml) runs after the merge.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the checks of the previous one
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # Throwaway database that lives only while this job runs: the values below are not secrets
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: personal_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d personal_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: personal_crm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On CI the tests run against a production build (see playwright.config.ts)
      - name: Build
        run: pnpm build

      # Google Chrome and Microsoft Edge come preinstalled on GitHub's Ubuntu runners
      - name: End-to-end tests
        run: pnpm test:e2e

      # The tests send the app server's output to this file (e2e/constants.ts)
      - name: Show the app server log
        if: failure()
        run: cat /tmp/personal-crm-e2e-server.log || true

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Only checks that the image builds; deploy.yml builds and pushes it after the merge
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
