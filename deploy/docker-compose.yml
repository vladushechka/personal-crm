# Production stack on the server, docker compose project "prod".
# CI copies this file and deploy.sh to /opt/crm/prod; deploy.sh runs it.
# Secrets come from /opt/crm/prod/.env (chmod 600, written by hand on the server).
# APP_IMAGE is set by deploy.sh; the running one is recorded in /opt/crm/prod/current-image.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is not set, run deploy.sh}
  env_file: .env
  environment:
    POSTGRES_HOST: db
  logging: *logging
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    # No published ports: only the app container reaches the database
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # One-off container from the app image: applies migrations and exits
  migrate:
    <<: *app
    command: ["node_modules/.bin/drizzle-kit", "migrate"]
    restart: "no"
    profiles: ["tools"]

  app:
    <<: *app
    restart: unless-stopped
    ports:
      # Only nginx on this server reaches the app; Docker would bypass the firewall otherwise
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
