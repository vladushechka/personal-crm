# App stack on the server, one file for both environments: compose project "prod" in /opt/crm/prod
# and "staging" in /opt/crm/staging (see env.sh). CI copies the whole deploy/ folder to the
# environment's folder; deploy.sh runs it.
# Secrets come from .env in that folder (chmod 600, written by hand on the server).
# APP_IMAGE and APP_PORT are set by the scripts; the running image is recorded in current-image.
# Both environments share one server: every container has a memory ceiling, so one of them
# can't starve the other or the landing.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The server has 1.8 GB; on 2026-11-11 the prod app used ~230 MB and its database ~55 MB
x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is not set, run deploy.sh}
  env_file: .env
  environment:
    POSTGRES_HOST: db
  logging: *logging
  deploy:
    resources:
      limits:
        memory: 512M
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    # No published ports: only the app container reaches the database
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256M

  # One-off container from the app image: applies migrations and exits.
  # OWNER_EMAIL from .env names the owner of the data that existed before sign-in
  migrate:
    <<: *app
    command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
    restart: "no"
    profiles: ["tools"]

  app:
    <<: *app
    restart: unless-stopped
    ports:
      # Only nginx on this server reaches the app; Docker would bypass the firewall otherwise.
      # prod 3000, staging 3001 (env.sh)
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
