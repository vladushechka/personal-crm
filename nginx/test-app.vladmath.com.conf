# Staging of Personal CRM: https://test-app.vladmath.com -> the staging app on 127.0.0.1:3001.
# Copy of /etc/nginx/sites-available/test-app.vladmath.com on the server, kept here for history;
# changed by hand on the server, then here. Other sites on the server are not ours to touch.
# Certificate "test-app": certbot certonly --webroot -w /var/www/certbot, renewed by certbot.timer,
# nginx reloads after a renewal (deploy hook).
# Closed with a password: /etc/nginx/test-app.htpasswd, set by the owner (README, "Тест-стенд").

server {
    listen 80;
    listen [::]:80;
    server_name test-app.vladmath.com;

    # Certificate checks of Let's Encrypt: plain http, no password
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test-app.vladmath.com;

    ssl_certificate /etc/letsencrypt/live/test-app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Staging holds real people's data: nothing opens without the password
    auth_basic "Personal CRM staging";
    auth_basic_user_file /etc/nginx/test-app.htpasswd;

    # Search engines stay away from staging
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The staging password stays in nginx, the app never sees it
        proxy_set_header Authorization "";
    }

    # While the app container is down, show the same stub as prod instead of a bare nginx error
    error_page 502 504 /app-stub.html;
    location = /app-stub.html {
        root /var/www/app-stub;
        try_files /index.html =404;
        internal;
    }
}
